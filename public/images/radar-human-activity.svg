<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="dish-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="spin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="48" fill="url(#bg-grad)" />

  <g opacity="0.1" fill="#38bdf8">
    <rect x="50" y="80" width="15" height="40" rx="4" />
    <rect x="75" y="60" width="15" height="80" rx="4" />
    <rect x="100" y="90" width="15" height="30" rx="4" />
    <rect x="480" y="450" width="15" height="70" rx="4" />
    <rect x="505" y="420" width="15" height="120" rx="4" />
    <rect x="530" y="470" width="15" height="50" rx="4" />
    <rect x="555" y="440" width="15" height="90" rx="4" />
  </g>

  <g id="radar" transform="translate(60, 320)">
    <line x1="40" y1="90" x2="0" y2="200" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <line x1="50" y1="90" x2="100" y2="200" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <line x1="45" y1="90" x2="50" y2="210" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <rect x="30" y="60" width="30" height="40" rx="6" fill="#334155" />
    <rect x="25" y="50" width="40" height="15" rx="4" fill="#1e293b" />
    <rect x="20" y="0" width="20" height="100" rx="8" fill="#64748b" />
    <path d="M 40 0 C 70 0, 90 25, 90 50 C 90 75, 70 100, 40 100 Z" fill="url(#dish-grad)" />
    <circle cx="65" cy="50" r="8" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="8;11;8" dur="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Radar waves: each arc pulses outward in sequence -->
  <g stroke="url(#wave-grad)" fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M 170 320 A 70 70 0 0 1 170 420" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="1.6s" begin="0s" repeatCount="indefinite" />
    </path>
    <path d="M 210 280 A 120 120 0 0 1 210 460" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="1.6s" begin="0.35s" repeatCount="indefinite" />
    </path>
    <path d="M 250 240 A 170 170 0 0 1 250 500" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="1.6s" begin="0.7s" repeatCount="indefinite" />
    </path>
    <path d="M 290 200 A 220 220 0 0 1 290 540" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="1.6s" begin="1.05s" repeatCount="indefinite" />
    </path>
  </g>

  <g stroke="url(#spin-grad)" fill="none" stroke-width="4" opacity="0.6">
    <ellipse cx="430" cy="360" rx="120" ry="35" stroke-dasharray="25 15 40 20" transform="rotate(-8 430 360)"/>
    <ellipse cx="430" cy="360" rx="145" ry="45" stroke-dasharray="80 30 15 20" transform="rotate(-4 430 360)"/>
  </g>

  <g id="person" filter="url(#glow)">
    <g stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <line x1="430" y1="220" x2="415" y2="330" />
      <line x1="430" y1="230" x2="360" y2="250" />
      <line x1="360" y1="250" x2="340" y2="310" />
      <line x1="430" y1="230" x2="490" y2="270" />
      <line x1="490" y1="270" x2="450" y2="320" />
      <line x1="415" y1="330" x2="390" y2="420" />
      <line x1="390" y1="420" x2="400" y2="500" />
      <line x1="415" y1="330" x2="470" y2="380" />
      <line x1="470" y1="380" x2="450" y2="460" />
    </g>
    <circle cx="430" cy="170" r="22" fill="#38bdf8" />
    <g fill="#ffffff">
      <circle cx="430" cy="170" r="5" />
      <circle cx="430" cy="230" r="5" />
      <circle cx="415" cy="330" r="5" />
      <circle cx="360" cy="250" r="5" />
      <circle cx="340" cy="310" r="5" />
      <circle cx="490" cy="270" r="5" />
      <circle cx="450" cy="320" r="5" />
      <circle cx="390" cy="420" r="5" />
      <circle cx="400" cy="500" r="5" />
      <circle cx="470" cy="380" r="5" />
      <circle cx="450" cy="460" r="5" />
    </g>
  </g>

  <g stroke="url(#spin-grad)" fill="none" stroke-width="6" opacity="0.9" filter="url(#glow)">
    <path d="M 312 368 A 120 35 0 0 0 548 352" stroke-dasharray="90 30" stroke-linecap="round"/>
    <path d="M 288 375 A 145 45 0 0 0 572 350" stroke-dasharray="140 40 30 20" stroke-linecap="round"/>
  </g>

  <g id="hud" transform="translate(320, 80)" filter="url(#hud-glow)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#022c22" opacity="0.7" stroke="#059669" stroke-width="1"/>
    <path d="M 10 0 L 4 0 L 4 36 L 10 36" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M 210 0 L 216 0 L 216 36 L 210 36" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="24" cy="18" r="6" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="2" fill="#34d399"/>
    <text x="40" y="23" font-family="monospace, sans-serif" font-size="13" font-weight="bold" fill="#34d399" letter-spacing="1">ACTIVITY: SPINNING</text>
  </g>

  <polyline points="430,116 430,126 460,146 460,170" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
</svg>