<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAFT over Drone Mesh icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#061018" />
      <stop offset="100%" stop-color="#0F1B26" />
    </linearGradient>
    <radialGradient id="leaderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9A9A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF6B6B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="drone">
      <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#FFD76B"></rect>
      <g fill="none" stroke="#FFD76B" stroke-width="1.6" opacity="0.9">
        <circle cx="-12" cy="0" r="5" />
        <circle cx="12" cy="0" r="5" />
        <circle cx="0" cy="-12" r="5" />
        <circle cx="0" cy="12" r="5" />
      </g>
    </g>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#17323f" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
  </g>

  <!-- Communication paths (invisible, used for motion) -->
  <path id="p1" d="M40 60 C65 85, 80 110, 95 150" fill="none" stroke="none"/>
  <path id="p2" d="M160 60 C135 85, 120 110, 105 150" fill="none" stroke="none"/>
  <path id="p3" d="M25 85 C55 105, 70 125, 60 150" fill="none" stroke="none"/>
  <path id="p4" d="M175 85 C145 105, 130 125, 140 150" fill="none" stroke="none"/>

  <!-- Servers / RAFT cluster -->
  <g filter="url(#softShadow)">
    <!-- left -->
    <g transform="translate(50,150)">
      <rect x="-16" y="-22" width="32" height="44" rx="3" fill="rgba(75,163,208,0.06)" stroke="#4BA3D0" stroke-width="1.8"/>
      <g fill="#4BA3D0">
        <circle cx="-8" cy="-12" r="2.6"/>
        <circle cx="0" cy="-12" r="2.6"/>
        <circle cx="8" cy="-12" r="2.6"/>
      </g>
    </g>
    <!-- center leader -->
    <g transform="translate(100,150)">
      <rect x="-16" y="-22" width="32" height="44" rx="3" fill="rgba(255,107,107,0.06)" stroke="#FF6B6B" stroke-width="2.2"/>
      <g fill="#FF6B6B">
        <circle cx="-8" cy="-12" r="2.8"/>
        <circle cx="0" cy="-12" r="2.8"/>
        <circle cx="8" cy="-12" r="2.8"/>
      </g>
      <!-- pulsing leader glow -->
      <circle cx="0" cy="-28" r="5" fill="#FF6B6B" opacity="0.95">
        <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.35;0.9" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-28" r="18" fill="url(#leaderGlow)" opacity="0.9"/>
    </g>
    <!-- right -->
    <g transform="translate(150,150)">
      <rect x="-16" y="-22" width="32" height="44" rx="3" fill="rgba(75,163,208,0.06)" stroke="#4BA3D0" stroke-width="1.8"/>
      <g fill="#4BA3D0">
        <circle cx="-8" cy="-12" r="2.6"/>
        <circle cx="0" cy="-12" r="2.6"/>
        <circle cx="8" cy="-12" r="2.6"/>
      </g>
    </g>
  </g>

  <!-- Drones (top) with rotor animation -->
  <g>
    <g transform="translate(40,45)">
      <use href="#drone" />
      <g transform="translate(-12,0)">
        <circle cx="0" cy="0" r="4" fill="#FFD76B" opacity="0.95"/>
        <g>
          <circle cx="0" cy="0" r="8" fill="none" stroke="#FFD76B" stroke-width="1.2" opacity="0.6"/>
          <g>
            <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.8">
              <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>
      <g transform="translate(12,0)">
        <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.8">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="-360 0 0" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(160,45)">
      <use href="#drone" />
      <g transform="translate(-12,0)">
        <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.8">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(12,0)">
        <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.8">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="-360 0 0" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(25,80)">
      <use href="#drone" />
      <g transform="translate(-12,0)">
        <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.75">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(175,80)">
      <use href="#drone" />
      <g transform="translate(12,0)">
        <rect x="-10" y="-1" width="20" height="2" fill="#FFD76B" opacity="0.75">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="-360 0 0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- Animated packet (small circles) moving along each path -->
  <g>
    <circle r="3" fill="#9EE7FF" opacity="0.95">
      <animateMotion dur="3.2s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
    </circle>
    <circle r="2.4" fill="#9EE7FF" opacity="0.9">
      <animateMotion dur="2.9s" begin="0.4s" repeatCount="indefinite">
        <mpath href="#p2"/>
      </animateMotion>
    </circle>
    <circle r="2.6" fill="#9EE7FF" opacity="0.85">
      <animateMotion dur="3.6s" begin="0.8s" repeatCount="indefinite">
        <mpath href="#p3"/>
      </animateMotion>
    </circle>
    <circle r="2.2" fill="#9EE7FF" opacity="0.9">
      <animateMotion dur="3.0s" begin="1.1s" repeatCount="indefinite">
        <mpath href="#p4"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Detected objects: small boxes that travel from drones to servers -->
  <g>
    <!-- object from top-left drone along p1 -->
    <rect width="6" height="6" rx="1" fill="#8BFF9A" opacity="0.95">
      <animateMotion dur="3.2s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
    </rect>
    <!-- staggered additional objects to feel random -->
    <rect width="5" height="5" rx="1" fill="#8BFF9A" opacity="0.9">
      <animateMotion dur="3.0s" begin="0.6s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
    </rect>

    <!-- objects from top-right drone along p2 -->
    <rect width="6" height="6" rx="1" fill="#FFD76B" opacity="0.95">
      <animateMotion dur="2.9s" begin="0.2s" repeatCount="indefinite">
        <mpath href="#p2"/>
      </animateMotion>
    </rect>
    <rect width="5" height="5" rx="1" fill="#FFD76B" opacity="0.85">
      <animateMotion dur="3.4s" begin="1.0s" repeatCount="indefinite">
        <mpath href="#p2"/>
      </animateMotion>
    </rect>

    <!-- objects from middle-left drone along p3 -->
    <rect width="6" height="6" rx="1" fill="#9EE7FF" opacity="0.95">
      <animateMotion dur="3.6s" begin="0.1s" repeatCount="indefinite">
        <mpath href="#p3"/>
      </animateMotion>
    </rect>
    <rect width="4" height="4" rx="1" fill="#9EE7FF" opacity="0.8">
      <animateMotion dur="2.7s" begin="0.9s" repeatCount="indefinite">
        <mpath href="#p3"/>
      </animateMotion>
    </rect>

    <!-- objects from middle-right drone along p4 -->
    <rect width="6" height="6" rx="1" fill="#FF9A9A" opacity="0.95">
      <animateMotion dur="3.0s" begin="0.3s" repeatCount="indefinite">
        <mpath href="#p4"/>
      </animateMotion>
    </rect>
    <rect width="4" height="4" rx="1" fill="#FF9A9A" opacity="0.8">
      <animateMotion dur="3.3s" begin="1.3s" repeatCount="indefinite">
        <mpath href="#p4"/>
      </animateMotion>
    </rect>
  </g>

  <!-- Glowing communication strokes -->
  <g stroke="#4BA3D0" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 60 C65 85, 80 110, 95 150" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="36" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M160 60 C135 85, 120 110, 105 150" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M25 85 C55 105, 70 125, 60 150" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M175 85 C145 105, 130 125, 140 150" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Labels -->
  <text x="100" y="26" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9FB7C9" text-anchor="middle" opacity="0.9">DRONE ROUTER MESH</text>
  <text x="100" y="188" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9FB7C9" text-anchor="middle" opacity="0.9">RAFT CLUSTER</text>

</svg>